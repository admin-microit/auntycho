<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aunty Cho - Account Login & Register</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --color-brand-700: #1b4332;
            --color-brand-800: #133124;
            --color-brand-50: #f2f7f4;
            --color-brand-100: #d8e5de;
        }

        body {
            background-color: #f8faf9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .auth-card {
            width: 100%;
            max-width: 440px;
            border: 1px solid rgba(27, 67, 50, 0.12);
            box-shadow: 0 20px 40px rgba(27, 67, 50, 0.08);
            border-radius: 1.25rem;
            background: #ffffff;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .brand-header {
            background-color: var(--color-brand-700);
            color: #ffffff;
            padding: 2.5rem 2rem 2rem 2rem;
            text-align: center;
        }

        .brand-logo {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem auto;
            font-size: 1.75rem;
        }

        .form-control {
            border: 1px solid var(--color-brand-100);
            background-color: #fcfdfe;
            padding: 0.75rem 1rem;
            font-size: 0.9rem;
            border-radius: 0.6rem;
            transition: all 0.25s ease;
        }

        .form-control:focus {
            border-color: var(--color-brand-700);
            box-shadow: 0 0 0 0.25rem rgba(27, 67, 50, 0.12);
            background-color: #ffffff;
        }

        .btn-brand {
            background-color: var(--color-brand-700);
            color: #ffffff;
            font-weight: 600;
            padding: 0.75rem 1rem;
            border-radius: 0.6rem;
            transition: all 0.25s ease;
            border: none;
        }

        .btn-brand:hover {
            background-color: var(--color-brand-800);
            color: #ffffff;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(27, 67, 50, 0.2);
        }

        .form-check-input:checked {
            background-color: var(--color-brand-700);
            border-color: var(--color-brand-700);
        }

        .auth-switch-link {
            color: var(--color-brand-700);
            font-weight: 600;
            text-decoration: none;
        }

        .auth-switch-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container py-5 d-flex justify-content-center">
        <div class="auth-card">
            
            <!-- Header Section -->
            <div class="brand-header">
                <div class="brand-logo">
                    <i class="fa-solid fa-store text-warning"></i>
                </div>
                <h4 class="fw-bold mb-1">Aunty Cho</h4>
                <p class="small text-white-50 mb-0">မြန်မာ့ရိုးရာ အစားအစာနှင့် အိမ်သုံးကုန်ပစ္စည်းများ</p>
            </div>

            <!-- Card Body -->
            <div class="p-4 p-sm-5">

                <!-- 1. LOGIN FORM -->
                <div id="loginSection">
                    <div class="mb-4 text-center">
                        <h5 class="fw-bold text-dark">အကောင့်ဝင်ရောက်ရန်</h5>
                        <p class="text-muted small">သင့်အကောင့်သို့ ဝင်ရောက်ရန် အချက်အလက်များ ဖြည့်ပါ။</p>
                    </div>

                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label text-xs fw-semibold text-secondary">Email</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted"><i class="fa-regular fa-envelope"></i></span>
                                <input type="email" class="form-control border-start-0" placeholder="example@gmail.com" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-xs fw-semibold text-secondary">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted"><i class="fa-solid fa-lock"></i></span>
                                <input type="password" class="form-control border-start-0" placeholder="••••••••" required>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mb-4 text-xs">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="rememberMe">
                                <label class="form-check-label text-muted" for="rememberMe">Remember me</label>
                            </div>
                            <a href="#" class="auth-switch-link small">Forget Password?</a>
                        </div>

                        <button type="submit" class="btn btn-brand w-100 mb-4">
                            Login<i class="fa-solid fa-arrow-right-to-bracket ms-2"></i>
                        </button>

                        <p class="text-center text-xs text-muted mb-0">
                            Don't have an account? 
                            <a href="javascript:void(0)" onclick="switchForm('register')" class="auth-switch-link">Sign up</a>
                        </p>
                    </form>
                </div>

                <!-- 2. REGISTER FORM (Default Hidden) -->
                <div id="registerSection" class="d-none">
                    <div class="mb-4 text-center">
                        <h5 class="fw-bold text-dark">အကောင့်အသစ်ဖွင့်ရန်</h5>
                        <p class="text-muted small">စျေးဝယ်ယူရန်အတွက် အကောင့်အသစ် ပြုလုပ်ပါ။</p>
                    </div>

                    <form id="registerForm">
                        <div class="mb-3">
                            <label class="form-label text-xs fw-semibold text-secondary">အမည် (Full Name)</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted"><i class="fa-regular fa-user"></i></span>
                                <input type="text" class="form-control border-start-0" placeholder="ဦး / ဒေါ်..." required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-xs fw-semibold text-secondary">Email</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted"><i class="fa-regular fa-envelope"></i></span>
                                <input type="email" class="form-control border-start-0" placeholder="example@gmail.com" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label text-xs fw-semibold text-secondary">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted"><i class="fa-solid fa-lock"></i></span>
                                <input type="password" class="form-control border-start-0" placeholder="••••••••" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-brand w-100 mb-4">
                            Sign up <i class="fa-solid fa-user-plus ms-2"></i>
                        </button>

                        <p class="text-center text-xs text-muted mb-0">
                            Already have an account? 
                            <a href="javascript:void(0)" onclick="switchForm('login')" class="auth-switch-link">Sign in</a>
                        </p>
                    </form>
                </div>

            </div>
        </div>
    </div>

    <!-- JavaScript to Switch Between Login & Register -->
    <script>
        function switchForm(target) {
            const loginSection = document.getElementById('loginSection');
            const registerSection = document.getElementById('registerSection');

            if (target === 'register') {
                loginSection.classList.add('d-none');
                registerSection.classList.remove('d-none');
            } else {
                registerSection.classList.add('d-none');
                loginSection.classList.remove('d-none');
            }
        }
    </script>
</body>
</html>
